<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Testing Decisions</title>
<desc id="d">An illustration of the case study: a fixed amount of test time split about 60, 30 and 10 percent across critical, medium and low flows, and a four-line release summary.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3f5e5"/><stop offset="1" stop-color="#dde8ff"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.2"/></filter>
<clipPath id="win"><rect x="50" y="34" width="1100" height="562" rx="16"/></clipPath>
</defs>
<style>
text{font-family:Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif}.m{font-family:Cascadia Code, Consolas, ui-monospace, Menlo, monospace}
.a{opacity:0;animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:ease}
@keyframes rb{0%,3%{opacity:0}4%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r1{0%,17%{opacity:0}18%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r2{0%,27%{opacity:0}28%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r3{0%,35%{opacity:0}36%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r4{0%,45%{opacity:0}46%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r5{0%,53%{opacity:0}54%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r6{0%,61%{opacity:0}62%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r7{0%,69%{opacity:0}70%,94%{opacity:1}97%,100%{opacity:0}}.rb{animation-name:rb}.r1{animation-name:r1}.r2{animation-name:r2}.r3{animation-name:r3}.r4{animation-name:r4}.r5{animation-name:r5}.r6{animation-name:r6}.r7{animation-name:r7}
@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.alt{display:none}.ghost{opacity:1!important}}
</style>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect x="50" y="34" width="1100" height="562" rx="16" fill="#ffffff" filter="url(#sh)"/>
<g clip-path="url(#win)"><rect x="50" y="34" width="1100" height="48" fill="#f3f4f6"/><rect x="50" y="81" width="1100" height="1" fill="#e5e7eb"/></g>
<circle cx="80" cy="58" r="7" fill="#f87171"/><circle cx="104" cy="58" r="7" fill="#fbbf24"/><circle cx="128" cy="58" r="7" fill="#34d399"/>
<text x="600.0" y="64" font-size="16" fill="#4b5563" text-anchor="middle">release-test-order</text>
<text class="a rb" x="106" y="150" font-size="26" fill="#374151">Time to test: fixed</text><rect class="a r1" x="106" y="172" width="592.8" height="64" rx="12" fill="#2563eb"/><text class="a r1" x="402.4" y="270" font-size="22" fill="#374151" text-anchor="middle">Critical 60%</text><rect class="a r2" x="698.8" y="172" width="296.4" height="64" rx="12" fill="#6d9bff"/><text class="a r2" x="847.0" y="270" font-size="22" fill="#374151" text-anchor="middle">Medium 30%</text><rect class="a r3" x="995.1999999999999" y="172" width="98.8" height="64" rx="12" fill="#b9ccff"/><text class="a r3" x="1044.6" y="270" font-size="22" fill="#374151" text-anchor="middle">Low 10%</text><rect x="106" y="304" width="988" height="262" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text class="a r4" x="134" y="342" font-size="17" font-weight="600" fill="#4b5563" letter-spacing="1">RELEASE SUMMARY (EXAMPLE)</text><g class="a r4"><text x="134" y="392" font-size="25" font-weight="600" fill="#1f2937">Tested</text><text x="320" y="392" font-size="25" fill="#374151">Critical: done. Medium: done. Low: partly done.</text></g><g class="a r5"><text x="134" y="440" font-size="25" font-weight="600" fill="#1f2937">Not tested</text><text x="320" y="440" font-size="25" fill="#374151">Two low-priority screens, not reached: time ran out.</text></g><g class="a r6"><text x="134" y="488" font-size="25" font-weight="600" fill="#1f2937">Found</text><text x="320" y="488" font-size="25" fill="#374151">One medium issue, does not block.</text></g><g class="a r7"><text x="134" y="536" font-size="25" font-weight="600" fill="#1f2937">Recommend</text><text x="320" y="536" font-size="25" fill="#374151">Ship. If the medium issue turns out to affect payments, hold.</text></g></svg>
