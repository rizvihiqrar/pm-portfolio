<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Rejected-Ticket Triage</title>
<desc id="d">An illustration of the case study: a rejected ticket is asked one question, whether the acceptance criteria already say it, and goes either to the requirement owner or back to the developer.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3f5e5"/><stop offset="1" stop-color="#dde8ff"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.2"/></filter>
<clipPath id="win"><rect x="50" y="34" width="1100" height="562" rx="16"/></clipPath>
</defs>
<style>
text{font-family:Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif}.m{font-family:Cascadia Code, Consolas, ui-monospace, Menlo, monospace}
.a{opacity:0;animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:ease}
@keyframes rb{0%,3%{opacity:0}4%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r1{0%,17%{opacity:0}18%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r2{0%,27%{opacity:0}28%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r3{0%,35%{opacity:0}36%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r4{0%,45%{opacity:0}46%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r5{0%,53%{opacity:0}54%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r6{0%,61%{opacity:0}62%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r7{0%,69%{opacity:0}70%,94%{opacity:1}97%,100%{opacity:0}}.rb{animation-name:rb}.r1{animation-name:r1}.r2{animation-name:r2}.r3{animation-name:r3}.r4{animation-name:r4}.r5{animation-name:r5}.r6{animation-name:r6}.r7{animation-name:r7}
@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.alt{display:none}.ghost{opacity:1!important}}
</style>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect x="50" y="34" width="1100" height="562" rx="16" fill="#ffffff" filter="url(#sh)"/>
<g clip-path="url(#win)"><rect x="50" y="34" width="1100" height="48" fill="#f3f4f6"/><rect x="50" y="81" width="1100" height="1" fill="#e5e7eb"/></g>
<circle cx="80" cy="58" r="7" fill="#f87171"/><circle cx="104" cy="58" r="7" fill="#fbbf24"/><circle cx="128" cy="58" r="7" fill="#34d399"/>
<text x="600.0" y="64" font-size="16" fill="#4b5563" text-anchor="middle">sent-back-ticket</text>
<text class="a rb" x="106" y="150" font-size="26" fill="#374151">Ticket sent back (sample)</text><rect class="a rb" x="106" y="190" width="300" height="150" rx="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><text class="a rb" x="130" y="232" font-size="20" fill="#6b7280">SAMPLE-14</text><text class="a rb" x="130" y="272" font-size="24" font-weight="600" fill="#1f2937">Rejected at testing</text><text class="a rb" x="130" y="308" font-size="20" fill="#4b5563">Export button does nothing</text><path class="a r1" d="M406 265 L470 265" stroke="#9ca3af" stroke-width="5" fill="none" stroke-linecap="round"/><g class="a r2"><rect x="470" y="210" width="260" height="110" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="600" y="258" font-size="22" font-weight="600" fill="#1d4ed8" text-anchor="middle">Do the criteria</text><text x="600" y="290" font-size="22" font-weight="600" fill="#1d4ed8" text-anchor="middle">already say it?</text></g><path class="a r3" d="M730 240 C790 240 800 170 860 170" stroke="#d97706" stroke-width="5" fill="none" stroke-linecap="round"/><text class="a r3" x="770" y="150" font-size="20" fill="#92400e">no</text><path class="a r4" d="M730 290 C790 290 800 380 860 380" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round"/><text class="a r4" x="770" y="430" font-size="20" fill="#1d4ed8">yes</text><g class="a r5"><rect x="860" y="125" width="290" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1005" y="164" font-size="22" font-weight="600" fill="#92400e" text-anchor="middle">Spec gap</text><text x="1005" y="194" font-size="20" fill="#78350f" text-anchor="middle">Fix the requirement first</text></g><g class="a r6"><rect x="860" y="335" width="290" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1005" y="374" font-size="22" font-weight="600" fill="#1d4ed8" text-anchor="middle">Implementation gap</text><text x="1005" y="404" font-size="20" fill="#1e3a8a" text-anchor="middle">Back to the developer</text></g><text class="a r7" x="106" y="530" font-size="22" fill="#4b5563">Two causes, two owners, one question to tell them apart.</text></svg>
