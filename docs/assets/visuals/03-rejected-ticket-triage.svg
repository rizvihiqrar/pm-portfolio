<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Triaging Tickets</title>
<desc id="d">An illustration of the case study: a ticket is raised, tested and rejected, then asked whether the acceptance criteria already say it. No means a spec gap that goes to the requirement owner. Yes means an implementation gap that goes back to the developer.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3f5e5"/><stop offset="1" stop-color="#dde8ff"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.2"/></filter>
<clipPath id="win"><rect x="50" y="34" width="1100" height="562" rx="16"/></clipPath>
</defs>
<style>
text{font-family:Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif}.m{font-family:Cascadia Code, Consolas, ui-monospace, Menlo, monospace}
.a{opacity:0;animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:ease}
@keyframes rb{0%,2%{opacity:0}3%,94%{opacity:1}97%,100%{opacity:0}}.rb{animation-name:rb}@keyframes tu{0%,2%{opacity:0;transform:translate(155px,278px)}3%{opacity:1;transform:translate(155px,278px)}9%{opacity:1;transform:translate(315px,278px)}15%{opacity:1;transform:translate(475px,278px)}21%{opacity:1;transform:translate(685px,278px)}27%{opacity:1;transform:translate(830px,208px)}33%{opacity:1;transform:translate(1036px,208px)}39%{opacity:1;transform:translate(1036px,208px)}42%{opacity:0;transform:translate(1036px,208px)}100%{opacity:0}}@keyframes td{0%,49%{opacity:0;transform:translate(155px,278px)}50%{opacity:1;transform:translate(155px,278px)}56%{opacity:1;transform:translate(315px,278px)}62%{opacity:1;transform:translate(475px,278px)}68%{opacity:1;transform:translate(685px,278px)}74%{opacity:1;transform:translate(830px,368px)}80%{opacity:1;transform:translate(1036px,368px)}86%{opacity:1;transform:translate(1036px,368px)}89%{opacity:0;transform:translate(1036px,368px)}100%{opacity:0}}.tk{opacity:0}@media (prefers-reduced-motion: reduce){.tk{animation:none!important;opacity:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}}
</style>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect x="50" y="34" width="1100" height="562" rx="16" fill="#ffffff" filter="url(#sh)"/>
<g clip-path="url(#win)"><rect x="50" y="34" width="1100" height="48" fill="#f3f4f6"/><rect x="50" y="81" width="1100" height="1" fill="#e5e7eb"/></g>
<circle cx="80" cy="58" r="7" fill="#f87171"/><circle cx="104" cy="58" r="7" fill="#fbbf24"/><circle cx="128" cy="58" r="7" fill="#34d399"/>
<text x="600.0" y="64" font-size="16" fill="#4b5563" text-anchor="middle">rejected-ticket</text>
<text class="a rb" x="106" y="128" font-size="26" fill="#374151">Two causes, two owners.</text><g class="a rb"><rect x="90" y="250" width="130" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="155" y="285" font-size="19" font-weight="600" fill="#1e3a8a" text-anchor="middle">Raised</text></g><g class="a rb"><rect x="250" y="250" width="130" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="315" y="285" font-size="19" font-weight="600" fill="#1e3a8a" text-anchor="middle">Tested</text></g><g class="a rb"><rect x="410" y="250" width="130" height="56" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="475" y="285" font-size="19" font-weight="600" fill="#991b1b" text-anchor="middle">Rejected</text></g><path class="a rb" d="M220 278 L250 278" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path class="a rb" d="M380 278 L410 278" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path class="a rb" d="M540 278 L590 278" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><g class="a rb"><rect x="590" y="238" width="190" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="685" y="274" font-size="19" font-weight="600" fill="#92400e" text-anchor="middle">Do the criteria</text><text x="685" y="296" font-size="15" fill="#4b5563" text-anchor="middle">already say it?</text></g><path class="a rb" d="M780 278 C800 278 800 208 820 208" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><path class="a rb" d="M780 278 C800 278 800 368 820 368" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><text class="a rb" x="794" y="198" font-size="17" fill="#92400e" text-anchor="middle">no</text><text class="a rb" x="794" y="396" font-size="17" fill="#1e3a8a" text-anchor="middle">yes</text><g class="a rb"><rect x="820" y="178" width="210" height="60" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="925" y="215" font-size="20" font-weight="600" fill="#92400e" text-anchor="middle">Spec gap</text></g><g class="a rb"><rect x="820" y="338" width="210" height="60" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="925" y="375" font-size="20" font-weight="600" fill="#1e3a8a" text-anchor="middle">Implementation gap</text></g><g class="a rb"><rect x="1050" y="178" width="80" height="60" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1090" y="215" font-size="18" font-weight="600" fill="#5b21b6" text-anchor="middle">Owner</text></g><g class="a rb"><rect x="1050" y="338" width="80" height="60" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1090" y="375" font-size="18" font-weight="600" fill="#5b21b6" text-anchor="middle">Dev</text></g><path class="a rb" d="M1030 208 L1050 208" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><path class="a rb" d="M1030 368 L1050 368" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><circle class="tk" r="13" fill="#dc2626" style="animation:tu 14s ease infinite"/><circle class="tk" r="13" fill="#dc2626" style="animation:td 14s ease infinite"/></svg>
