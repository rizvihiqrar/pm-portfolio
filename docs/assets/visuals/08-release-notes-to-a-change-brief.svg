<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Release Notes to a Change Brief</title>
<desc id="d">An illustration of the case study: a pull request for a change brief, where a reviewer asks of every line whether the customer has to do something. Each visible line is marked as an action box or one plain line, and a change nobody can see skips the question and stays in the release notes.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3f5e5"/><stop offset="1" stop-color="#dde8ff"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.2"/></filter>
<clipPath id="win"><rect x="50" y="34" width="1100" height="562" rx="16"/></clipPath>
</defs>
<style>
text{font-family:Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif}.m{font-family:Cascadia Code, Consolas, ui-monospace, Menlo, monospace}
.a{opacity:0;animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:ease}
@keyframes rb{0%,2%{opacity:0}3%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r1{0%,13%{opacity:0}14%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r2{0%,25%{opacity:0}26%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r3{0%,35%{opacity:0}36%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r4{0%,45%{opacity:0}46%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r5{0%,55%{opacity:0}56%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r6{0%,67%{opacity:0}68%,94%{opacity:1}97%,100%{opacity:0}}.rb{animation-name:rb}.r1{animation-name:r1}.r2{animation-name:r2}.r3{animation-name:r3}.r4{animation-name:r4}.r5{animation-name:r5}.r6{animation-name:r6}
@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}}
</style>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect x="50" y="34" width="1100" height="562" rx="16" fill="#ffffff" filter="url(#sh)"/>
<g clip-path="url(#win)"><rect x="50" y="34" width="1100" height="48" fill="#f3f4f6"/><rect x="50" y="81" width="1100" height="1" fill="#e5e7eb"/></g>
<circle cx="80" cy="58" r="7" fill="#f87171"/><circle cx="104" cy="58" r="7" fill="#fbbf24"/><circle cx="128" cy="58" r="7" fill="#34d399"/>
<text x="600.0" y="64" font-size="16" fill="#4b5563" text-anchor="middle">Pull request: Harbourline 2.4</text>
<g class="a rb"><rect x="106" y="104" width="64" height="30" rx="15" fill="#16a34a"/><text x="138" y="125" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Open</text><text x="186" y="126" font-size="26" font-weight="600" fill="#1f2937">Change brief for release 2.4</text></g><g class="a r1"><circle cx="128" cy="190" r="20" fill="#cbd5e1"/><rect x="164" y="150" width="440" height="84" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="182" y="176" font-size="15" fill="#4b5563">Reviewer asks of every line</text><text x="182" y="202" font-size="20" font-weight="600" fill="#92400e">Must the customer</text><text x="182" y="226" font-size="20" font-weight="600" fill="#92400e">do something?</text></g><g class="a r1"><rect x="106" y="262" width="988" height="36" fill="#f6f8fa" stroke="#d0d7de"/><text x="122" y="286" font-size="15" class="m" fill="#57606a">change-brief.md</text></g><g class="a r2"><rect x="106" y="298" width="988" height="58" fill="#e6ffec" stroke="#d0d7de"/><text x="124" y="332" font-size="17" class="m" fill="#57606a">+</text><text x="156" y="332" font-size="18" class="m" fill="#1f2937">Old booking links stop working</text><rect x="800" y="308" width="270" height="38" rx="19" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="935" y="334" font-size="19" font-weight="600" fill="#991b1b" text-anchor="middle">Action box</text></g><g class="a r3"><rect x="106" y="356" width="988" height="58" fill="#e6ffec" stroke="#d0d7de"/><text x="124" y="390" font-size="17" class="m" fill="#57606a">+</text><text x="156" y="390" font-size="18" class="m" fill="#1f2937">Sign-in asks for an emailed code</text><rect x="800" y="366" width="270" height="38" rx="19" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="935" y="392" font-size="19" font-weight="600" fill="#991b1b" text-anchor="middle">Action box</text></g><g class="a r4"><rect x="106" y="414" width="988" height="58" fill="#e6ffec" stroke="#d0d7de"/><text x="124" y="448" font-size="17" class="m" fill="#57606a">+</text><text x="156" y="448" font-size="18" class="m" fill="#1f2937">Bookings can be moved to another day</text><rect x="800" y="424" width="270" height="38" rx="19" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="935" y="450" font-size="19" font-weight="600" fill="#1e3a8a" text-anchor="middle">One line</text></g><g class="a r5"><rect x="106" y="472" width="988" height="58" fill="#ffebe9" stroke="#d0d7de"/><text x="124" y="506" font-size="17" class="m" fill="#57606a">-</text><text x="156" y="506" font-size="18" class="m" fill="#1f2937">Database library updated</text><rect x="800" y="482" width="270" height="38" rx="19" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="935" y="508" font-size="19" font-weight="600" fill="#374151" text-anchor="middle">Release notes only</text><text x="156" y="524" font-size="14" fill="#6b7280">not asked: nobody can see it</text></g><text class="a r6" x="106" y="573" font-size="21" fill="#4b5563">The reviewer asks one question for each line.</text></svg>
