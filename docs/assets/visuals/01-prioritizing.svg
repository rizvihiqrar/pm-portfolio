@keyframes pa{0%,3%{opacity:0}4%,44%{opacity:1}47%,100%{opacity:0}}@keyframes pb{0%,51%{opacity:0}52%,94%{opacity:1}97%,100%{opacity:0}}.pa{animation-name:pa}.pb{animation-name:pb}
